# Netlify configuration for anodyneantiques.com
# Static site — no build step.

[build]
  publish = "."

# HTML: always revalidate so content edits show up immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets: cached for a day. Images are swapped in-place by filename,
# so we deliberately avoid long/immutable caching. CSS/JS carry ?v=
# version query strings for busting on top of this.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
