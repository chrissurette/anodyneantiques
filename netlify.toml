# Netlify configuration for naplesantiquesllc.com
# Static site — no build step on Netlify. `node build.mjs` runs locally and
# writes the deployable site into staging/, whose CONTENTS are pushed to GitHub.
# This file is the source of truth; the build copies it into staging/.

[build]
  publish = "."

# Old-domain forwarding. Netlify serves domain aliases as-is (only the primary's
# www/apex pair redirects by itself), so the previous domain needs explicit,
# forced 301s — path for path. This file is not publicly served (404), so the
# old name stays invisible to visitors. Keep for at least a year.
[[redirects]]
  from = "https://anodyneantiques.com/*"
  to = "https://naplesantiquesllc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.anodyneantiques.com/*"
  to = "https://naplesantiquesllc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://anodyneantiques.com/*"
  to = "https://naplesantiquesllc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.anodyneantiques.com/*"
  to = "https://naplesantiquesllc.com/:splat"
  status = 301
  force = true

# HTML: always revalidate so content edits show up immediately.
# (Extensionless page URLs like /estate-services/ get Netlify's default
#  max-age=0, must-revalidate, so no extra rule is needed for them.)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets: cached for a day. Images are swapped in-place by filename,
# so we deliberately avoid long/immutable caching. CSS/JS carry ?v=
# content-hash query strings (generated by build.mjs) for busting on top of this.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
